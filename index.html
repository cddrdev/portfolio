<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de Carlos de Diego Rodríguez, desarrollador full stack junior con experiencia en desarrollo web e integración de IA."
    />
    <meta name="theme-color" content="#f8f8f3" />
    <script>
      (() => {
        let theme;
        let language;
        try {
          theme = localStorage.getItem('portfolio-theme');
          language = localStorage.getItem('portfolio-language');
        } catch {
        }
        const dark = theme === 'dark' || (
          theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches
        );
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.lang = language === 'en' ? 'en' : 'es';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101b15' : '#f8f8f3';
      })();
    </script>
    <meta name="author" content="Carlos de Diego Rodríguez" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Carlos de Diego Rodríguez · Desarrollador full stack" />
    <meta
      property="og:description"
      content="Desarrollador full stack junior. Proyectos web con React, Node.js y Python e integración de IA para recomendar productos según las preferencias del cliente."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Carlos de Diego Rodríguez · Desarrollador full stack" />
    <meta
      name="twitter:description"
      content="Proyectos, experiencia y tecnologías de Carlos de Diego Rodríguez, desarrollador full stack junior."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Carlos de Diego Rodríguez · Desarrollador full stack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
